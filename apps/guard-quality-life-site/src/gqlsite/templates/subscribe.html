{% extends "base.html" %}
{% block title %}订阅 · 守护品质生活{% endblock %}
{% block content %}
<section class="hero">
  <h1>订阅更新</h1>
  <p class="lede">登记你的兴趣域，后续内容更新时可第一时间收到通知。</p>
</section>

{% if submitted %}
<div class="card article">
  <h2>✅ 已成功登记</h2>
  <p class="lede">感谢你的关注，我们会在对应生活域有更新时与你联系。</p>
  <p class="muted small">记录编号 #{{ sub_id }}</p>
  <p><a class="btn" href="/">返回知识树</a></p>
</div>
{% else %}
<form class="card form" method="post" action="/subscribe">
  <label for="name">姓名</label>
  <input type="text" id="name" name="name" required placeholder="怎么称呼你">

  <label for="email">邮箱</label>
  <input type="email" id="email" name="email" required placeholder="name@example.com">

  <label for="interests">兴趣域（可多选，以逗号分隔）</label>
  <div class="interest-chips">
    {% for d in domains %}
    <label class="chip"><input type="checkbox" name="interests" value="{{ d.name }}">{{ d.name }}</label>
    {% endfor %}
  </div>

  <button type="submit" class="btn">提交订阅</button>
</form>
{% endif %}
{% endblock %}
